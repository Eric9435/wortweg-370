name: Export A2 and B1 German-only reading PDFs

on:
  push:
    branches: [main]
    paths:
      - 'a2-reading-chapters.js'
      - 'b1-reading-chapters.js'
      - 'scripts/export_a2_b1_readings.py'
      - '.github/workflows/export-a2-b1-readings.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wortweg-a2-b1-reading-pdf
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original WortWeg German readings
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools and German font
        run: |
          python -m pip install --disable-pip-version-check reportlab pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
      - name: Export A2 B1 original German reading chapters
        run: python scripts/export_a2_b1_readings.py
      - name: Verify three separate and combined reading documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          d=json.loads(Path('WortWeg_A2_B1_German_Reading_Export_Summary.json').read_text())
          assert d['original_chapters']=={'A2':14,'B1':16}
          assert {k:v['chapters'] for k,v in d['documents'].items()}=={'A2':14,'B1':16,'A2-B1':30}
          for key,item in d['documents'].items():
              pdf=PdfReader(item['file'])
              assert len(pdf.pages)==item['pages'] and len(pdf.pages)>0
              assert Path(item['file']).stat().st_size>5000
              print(key,item['chapters'],'chapters',len(pdf.pages),'A4 pages')
          PY
      - name: Provide standalone downloadable PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WortWeg-A2-B1-German-Only-Reading-PDFs
          path: |
            WortWeg_A2_Reading_German_Only.pdf
            WortWeg_B1_Reading_German_Only.pdf
            WortWeg_A2_B1_Reading_German_Only_Combined.pdf
            WortWeg_A2_B1_German_Reading_Export_Summary.json
          retention-days: 90
      - name: Publish standalone PDFs (no website menu edits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WortWeg_A2_Reading_German_Only.pdf WortWeg_B1_Reading_German_Only.pdf WortWeg_A2_B1_Reading_German_Only_Combined.pdf WortWeg_A2_B1_German_Reading_Export_Summary.json
          if git diff --cached --quiet; then
            echo "German-only reading PDFs already up to date"
          else
            git commit -m "docs(export): publish A2 and B1 German-only reading PDFs"
            git push
          fi
