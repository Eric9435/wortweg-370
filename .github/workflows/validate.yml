name: Validate WortWeg
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript, manifest, and account persistence hooks
        run: |
          node --check sw.js
          node --input-type=module --check < extra-progress-sync.js
          node --input-type=module --check < cloud.js
          node test-extra-progress-sync.cjs
          node --check settings.js
          node test-offline-account.cjs
          node test-safari-storage-recovery.cjs
          node test-safari-storage-diagnostics.cjs
          node test-safari-storage-fallback.cjs
          node --check live-content.js
          node --check ios-polish.js
          node --check whiteboard.js
          node --check page-navigation.js
          node test-premium-ui.cjs
          node --check reading-studio.js
          node --check seen-words.js
          node --check flashcards.js
          node --check articles-quiz.js
          node --check noun-expansion.js
          node --check special-vocabulary.js
          node --check home-refresh.js
          node --check bank-browser.js
          node --check grammar.js
          node --check topic-reading-seeds-1.js
          node --check topic-reading-seeds-2.js
          node --check topic-reading-seeds-3.js
          node --check topic-reading-seeds-4.js
          node --check topic-reading-engine.js
          node --check topic-lessons.js
          node --check reading-studio-topics-01-12.js
          node --check reading-studio-topics-13-24.js
          node --check reading-studio.js
          node --check reading-word-explorer.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!script)throw Error('App script missing');
          new vm.Script(script[1],{filename:'wortweg-app.js'});
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!manifest.name)throw Error('Manifest missing name');
          for(const marker of ['wortweg370-progress-v3','tryLocalSave(storageKey()','switchProfile:id=>','function record(w,good)']){
            if(!html.includes(marker))throw Error('Missing persistence feature: '+marker);
          }
          console.log('PASS: JavaScript syntax, manifest, and persistence hooks');
          NODE
      - name: Verify A1-C1 grammar lesson completeness and packaged assets
        run: |
          node --check grammar.js
          node --check grammar-expanded.js
          node --check grammar-more-a1-a2.js
          node --check grammar-more-b1.js
          node --check grammar-more-b2.js
          node --check grammar-more-c1.js
          node test-grammar-catalog.cjs
      - name: Validate 288-table Lifetime Grammar index and separate offline workspace
        run: |
          node --check lifetime-grammar.js
          node --check lifetime-grammar-index-1.js
          node --check lifetime-grammar-index-2.js
          node --check lifetime-grammar-examples.js
          node --check lifetime-grammar-rules-1.js
          node --check lifetime-grammar-rules-2.js
          node test-lifetime-grammar.cjs
      - name: Verify vocabulary writing repetition tracking
        run: node test-vocab-writing.cjs
      - name: Validate reversible iPhone Home dashboard
        run: node test-home-refresh.cjs
      - name: Install test-only DOM simulator
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Prevent Home menu MutationObserver infinite reordering on mobile
        run: node test-menu-observer-stability.cjs
      - name: Verify 48 memorize charts and interactive study mode
        run: |
          node --check lifetime-memorize.js
          node --check lifetime-memorize-1.js
          node --check lifetime-memorize-2.js
          node test-lifetime-memorize.cjs
      - name: Smoke test Lifetime Grammar browser navigation, reference tables and progress
        run: node test-lifetime-grammar-ui.cjs
      - name: Check per-page navigation and reading menu scope
        run: node test-page-navigation.cjs
      - name: Verify teaching whiteboard tools and independent screen annotations
        run: node test-whiteboard.cjs
      - name: Verify every vocabulary word is accessible with pagination and continuous scrolling
        run: node test-bank-browser.cjs
      - name: Verify six-category Special Vocabulary and isolated progress
        run: node test-special-vocabulary.cjs
      - name: Verify all-word flashcards and saved review records
        run: |
          node test-flashcards.cjs
          node test-flashcard-animation.cjs
      - name: Verify all-word Der Die Das quiz, persistence, review and native assets
        run: node test-articles-quiz.cjs
      - name: Verify curated singular noun expansion and cross-app integration
        run: node test-noun-expansion.cjs
      - name: Validate A1-C2 noun balance, original article conflicts and data integrity
        run: node test-noun-all-levels.cjs
      - name: Verify complete A1 reader covers all Word Bank and noun entries
        run: node test-a1-complete-reader.cjs
      - name: Verify German speech playback on each A1 chapter
        run: node test-a1-german-audio.cjs
      - name: Verify CEFR level menu and complete A2 reader
        run: node test-complete-reading-a2.cjs
      - name: Verify complete B1 reading, German speech and offline integration
        run: |
          node --check b1-reading-chapters.js
          node test-b1-complete-reader.cjs
      - name: Verify standalone A1–B1 Dialog and full vocabulary coverage
        run: |
          node --check dialog.js
          node --check dialog-situations.js
          node --check dialog-situations-a2.js
          node --check dialog-situations-b1.js
          node test-dialog.cjs
      - name: Verify flashcard ratings appear in Seen Words
        run: node test-flashcard-seen.cjs
      - name: Verify dynamic lessons, offline cache, and secure account separation
        run: node test-live-content.cjs
      - name: Check network-first website lesson updates
        run: node test-serviceworker-updates.cjs
      - name: Verify Android update scripts and public version baseline
        run: |
          node --check mobile/src/update-check.js
          node --check mobile/src/app-updates.js
          node --check mobile/src/native.js
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const info=JSON.parse(fs.readFileSync('mobile/src/build-info.json','utf8'));
          const published=JSON.parse(fs.readFileSync('updates/android.json','utf8'));
          const gradle=fs.readFileSync('mobile/android/app/build.gradle','utf8');
          assert.equal(Number(gradle.match(/versionCode\s+(\d+)/)[1]),info.versionCode);
          assert.equal(gradle.match(/versionName\s+"([^"]+)"/)[1],info.versionName);
          assert.equal(info.packageName,published.packageName);
          assert.ok(published.versionCode<=info.versionCode,'Only real public APKs can appear in update manifest');
          console.log('PASS: Android update syntax, version integrity and safe public release baseline');
          NODE
      - name: Test saved answers and separate account progress
        run: node test-memory.cjs
      - name: Verify offline quiz checkpoint and Continue / New flow
        run: node test-quiz-resume.cjs
      - name: Test game-style navigation and Google profile onboarding
        run: node test-game-ui.cjs
      - name: Verify iOS-inspired UI and account-aware progress
        run: node test-ios-polish.cjs
      - name: Verify premium iPhone-style Home, grammar card and mobile layout
        run: node test-premium-home.cjs
      - name: Verify Seen Words table and CEFR progress
        run: |
          node test-seen-words.cjs
          node test-home-noun-dashboard.cjs
      - name: Verify all 370 Topics have word lists and functional quizzes
        run: |
          node test-topic-lessons.cjs
          node test-topic-reading.cjs
      - name: Verify per-word German tooltip, English Myanmar detail, grammar and word voice
        run: node test-reading-word-explorer.cjs
      - name: Verify trilingual long-form reading window and German narration seeking
        run: node test-reading-studio.cjs
      - name: Verify all topic titles have functioning MCQs and isolated practice
        run: node test-topic-quiz-ready.cjs
      - name: Verify compact Settings navigation and all existing controls
        run: node test-settings-navigation.cjs
      - name: Verify card-free UI and authentication entry
        run: node mobile/scripts/test-ui.mjs

