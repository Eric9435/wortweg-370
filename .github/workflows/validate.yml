name: Validate WortWeg
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One-off C1 noun corpus audit
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const src=JSON.parse(html.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/)[1]);
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('noun-expansion.js','utf8'),ctx);
          const extra=ctx.window.WortWegNounExpansion.entries;
          const base=[...src.bank,...src.curated];
          const extract=w=>{
            const m=/^(der|die|das)\s+(.+)$/iu.exec(String(w.de||'').trim().replace(/\s+/g,' '));
            return m?{article:m[1].toLowerCase(),lemma:m[2].trim().toLocaleLowerCase('de'),de:w.de,
              level:w.level||'Topic 1',type:w.type||'curated',en:w.en||''}:null;
          };
          const head=base.map(extract).filter(Boolean);
          const B=new Map(),E=new Map();
          for(const w of head){if(!B.has(w.lemma))B.set(w.lemma,[]);B.get(w.lemma).push(w);}
          for(const w of extra.map(extract)){if(!E.has(w.lemma))E.set(w.lemma,[]);E.get(w.lemma).push(w);}
          const conflicts=[],redundant=[],noBase=[],inconsistentBase=[];
          let c1New=0, c1Duplicate=0, newTotal=0;
          const topic={},article={},level={};
          for(const w of extra){
            const e=extract(w),matches=B.get(e.lemma)||[];
            const other=matches.filter(x=>x.article!==e.article);
            if(other.length)conflicts.push({expansion:e.de,original:other.slice(0,4).map(x=>({de:x.de,id:x.id,en:x.en,level:x.level,type:x.type}))});
            if(matches.some(x=>x.article===e.article)){
              redundant.push({de:e.de,original:matches.slice(0,2).map(x=>x.de),level:w.level,topic:w.topic});if(w.level==='C1')c1Duplicate++;
            }else{newTotal++;if(w.level==='C1')c1New++;}
            const k=w.topic;topic[k]=(topic[k]||0)+1;
            article[e.article]=(article[e.article]||0)+1;
            level[w.level]=(level[w.level]||0)+1;
          }
          for(const [k,rows] of B){
            if(new Set(rows.map(x=>x.article)).size>1)inconsistentBase.push({lemma:k,alternates:rows.map(x=>x.de).slice(0,7)});
          }
          const suffix={};
          for(const w of extra){
            const e=extract(w),name=e.lemma;
            for(const s of ['ung','heit','keit','schaft','tion','tät','ei','chen','lein']){
              if(!name.endsWith(s))continue;
              const key=s+'_'+e.article;suffix[key]=(suffix[key]||0)+1;
            }
          }
          const sourceLevels={};
          for(const w of src.bank){
            const typ=String(w.type||'');
            const lev=String(w.level||'');
            sourceLevels[lev]??={};
            sourceLevels[lev][typ]=(sourceLevels[lev][typ]||0)+1;
          }
          console.log('C1_AUDIT='+JSON.stringify({
            originalTotal:src.bank.length,baseArticleEntries:head.length,baseUniqueLemmas:B.size,
            expansionTotal:extra.length,uniqueExpansion:E.size,level,article,topic,
            genuinelyNew:newTotal,c1New,c1Duplicate,
            duplicatesCount:redundant.length,duplicateSample:redundant.slice(0,16),
            contradictions:conflicts.length,contradictionExamples:conflicts.slice(0,60),
            originalConflicts:inconsistentBase.length,baseContradictions:inconsistentBase.slice(0,35),
            suffix,originalTypesByLevel:sourceLevels
          }));
          NODE
      - name: Spot-check broad high-utility academic noun coverage
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const base=JSON.parse(html.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/)[1]);
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('noun-expansion.js','utf8'),ctx);
          const strings=[...base.bank,...base.curated,...ctx.window.WortWegNounExpansion.entries]
            .map(w=>String(w.de||'').trim().toLocaleLowerCase('de'));
          const known=new Set(strings);
          const groups={
            academic:'die Erkenntnis;die Herausforderung;die Voraussetzung;die Auswirkung;die Entwicklung;die Veränderung;die Verbesserung;die Umsetzung;die Lösung;die Bedeutung;die Annahme;die Aussage;die Behauptung;die Begründung;die Ursache;die Folge;die Konsequenz;die Tatsache;die Möglichkeit;die Wahrscheinlichkeit;die Unsicherheit;die Einschränkung;die Bedingung;die Regelung;die Bestimmung;die Vorgehensweise;die Herangehensweise;die Darstellung;die Untersuchung;die Analyse;die Bewertung;die Schlussfolgerung;die Zusammenfassung;die Fragestellung;die Problemstellung;die Zielsetzung;die Zielstellung;die Methodik;die Vorgehensweise;die Abweichung;die Feststellung;die Erkenntnisgewinnung',
            society:'die Gesellschaft;die Bevölkerung;die Gemeinschaft;die Verantwortung;die Gerechtigkeit;die Gleichberechtigung;die Chancengleichheit;die Integration;die Vielfalt;die Diskriminierung;die Nachhaltigkeit;die Lebensqualität;die Lebensbedingungen;die Zuwanderung;die Einwanderung;die Auswanderung;die Mitbestimmung;die Beteiligung;die Teilhabe;die Ausgrenzung;die Öffentlichkeit;die Stellungnahme;die Haltung;die Einstellung;die Überzeugung;die Wahrnehmung;die Zustimmung;die Ablehnung;die Nachfrage;die Forderung;die Auseinandersetzung',
            economics:'die Wirtschaft;die Nachfrage;die Produktion;die Herstellung;die Arbeitslosigkeit;die Beschäftigung;die Finanzierung;die Förderung;die Investition;die Inflation;die Rezession;die Konjunktur;die Krise;die Belastung;die Auslastung;die Kosten;die Einnahme;die Ausgabe;die Ausgaben;die Schulden;die Verteilung;die Ungleichheit;die Knappheit;die Ressourcen;die Versorgung;die Verfügbarkeit;die Abhängigkeit;die Energieversorgung;die Wettbewerbsfähigkeit',
            masculines:'der Ansatz;der Zusammenhang;der Einfluss;der Unterschied;der Vorteil;der Nachteil;der Bedarf;der Bestand;der Aufwand;der Nutzen;der Schaden;der Mangel;der Rückgang;der Anstieg;der Zuwachs;der Fortschritt;der Rückschritt;der Wandel;der Umbruch;der Verlust;der Gewinn;der Anteil;der Beitrag;der Begriff;der Befund;der Nachweis;der Verlauf;der Umfang;der Schwerpunkt;der Rahmen;der Aspekt;der Hintergrund;der Kontext',
            neuters:'das Ergebnis;das Problem;das Ziel;das Vorhaben;das Verfahren;das Verhalten;das Verständnis;das Bewusstsein;das Wissen;das Interesse;das Bedürfnis;das Verhältnis;das Ausmaß;das Merkmal;das Kriterium;das Konzept;das Modell;das System;das Muster;das Risiko;das Potenzial;das Hindernis;das Defizit;das Phänomen;das Prinzip;das Argument;das Beispiel;das Mittel;das Wachstum;das Einkommen;das Vertrauen;das Wohlbefinden;das Umfeld'
          };
          const summary={},missingAll=[];
          for(const [group,words] of Object.entries(groups)){
            const arr=[...new Set(words.split(';'))];
            const absent=arr.filter(v=>!known.has(v.toLocaleLowerCase('de')));
            summary[group]={sample:arr.length,present:arr.length-absent.length,missing:absent};
            missingAll.push(...absent);
          }
          console.log('ACADEMIC_SPOT_CHECK='+JSON.stringify({groupSummary:summary,overallMissingCount:missingAll.length}));
          NODE
      - name: Check JavaScript, manifest, and account persistence hooks
        run: |
          node --check sw.js
          node --input-type=module --check < extra-progress-sync.js
          node --input-type=module --check < cloud.js
          node test-extra-progress-sync.cjs
          node --check settings.js
          node test-offline-account.cjs
          node test-safari-storage-recovery.cjs
          node test-safari-storage-diagnostics.cjs
          node test-safari-storage-fallback.cjs
          node --check live-content.js
          node --check ios-polish.js
          node --check whiteboard.js
          node --check page-navigation.js
          node test-premium-ui.cjs
          node --check reading-studio.js
          node --check seen-words.js
          node --check flashcards.js
          node --check articles-quiz.js
          node --check noun-expansion.js
          node --check special-vocabulary.js
          node --check home-refresh.js
          node --check bank-browser.js
          node --check grammar.js
          node --check topic-reading-seeds-1.js
          node --check topic-reading-seeds-2.js
          node --check topic-reading-seeds-3.js
          node --check topic-reading-seeds-4.js
          node --check topic-reading-engine.js
          node --check topic-lessons.js
          node --check reading-studio-topics-01-12.js
          node --check reading-studio-topics-13-24.js
          node --check reading-studio.js
          node --check reading-word-explorer.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!script)throw Error('App script missing');
          new vm.Script(script[1],{filename:'wortweg-app.js'});
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(!manifest.name)throw Error('Manifest missing name');
          for(const marker of ['wortweg370-progress-v3','tryLocalSave(storageKey()','switchProfile:id=>','function record(w,good)']){
            if(!html.includes(marker))throw Error('Missing persistence feature: '+marker);
          }
          console.log('PASS: JavaScript syntax, manifest, and persistence hooks');
          NODE
      - name: Verify A1-C1 grammar lesson completeness and packaged assets
        run: |
          node --check grammar.js
          node --check grammar-expanded.js
          node --check grammar-more-a1-a2.js
          node --check grammar-more-b1.js
          node --check grammar-more-b2.js
          node --check grammar-more-c1.js
          node test-grammar-catalog.cjs
      - name: Validate 288-table Lifetime Grammar index and separate offline workspace
        run: |
          node --check lifetime-grammar.js
          node --check lifetime-grammar-index-1.js
          node --check lifetime-grammar-index-2.js
          node --check lifetime-grammar-examples.js
          node --check lifetime-grammar-rules-1.js
          node --check lifetime-grammar-rules-2.js
          node test-lifetime-grammar.cjs
      - name: Verify vocabulary writing repetition tracking
        run: node test-vocab-writing.cjs
      - name: Validate reversible iPhone Home dashboard
        run: node test-home-refresh.cjs
      - name: Install test-only DOM simulator
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Prevent Home menu MutationObserver infinite reordering on mobile
        run: node test-menu-observer-stability.cjs
      - name: Verify 48 memorize charts and interactive study mode
        run: |
          node --check lifetime-memorize.js
          node --check lifetime-memorize-1.js
          node --check lifetime-memorize-2.js
          node test-lifetime-memorize.cjs
      - name: Smoke test Lifetime Grammar browser navigation, reference tables and progress
        run: node test-lifetime-grammar-ui.cjs
      - name: Check per-page navigation and reading menu scope
        run: node test-page-navigation.cjs
      - name: Verify teaching whiteboard tools and independent screen annotations
        run: node test-whiteboard.cjs
      - name: Verify every vocabulary word is accessible with pagination and continuous scrolling
        run: node test-bank-browser.cjs
      - name: Verify six-category Special Vocabulary and isolated progress
        run: node test-special-vocabulary.cjs
      - name: Verify all-word flashcards and saved review records
        run: |
          node test-flashcards.cjs
          node test-flashcard-animation.cjs
      - name: Verify all-word Der Die Das quiz, persistence, review and native assets
        run: node test-articles-quiz.cjs
      - name: Verify curated singular noun expansion and cross-app integration
        run: node test-noun-expansion.cjs
      - name: Verify flashcard ratings appear in Seen Words
        run: node test-flashcard-seen.cjs
      - name: Verify dynamic lessons, offline cache, and secure account separation
        run: node test-live-content.cjs
      - name: Check network-first website lesson updates
        run: node test-serviceworker-updates.cjs
      - name: Verify Android update scripts and public version baseline
        run: |
          node --check mobile/src/update-check.js
          node --check mobile/src/app-updates.js
          node --check mobile/src/native.js
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const info=JSON.parse(fs.readFileSync('mobile/src/build-info.json','utf8'));
          const published=JSON.parse(fs.readFileSync('updates/android.json','utf8'));
          const gradle=fs.readFileSync('mobile/android/app/build.gradle','utf8');
          assert.equal(Number(gradle.match(/versionCode\s+(\d+)/)[1]),info.versionCode);
          assert.equal(gradle.match(/versionName\s+"([^"]+)"/)[1],info.versionName);
          assert.equal(info.packageName,published.packageName);
          assert.ok(published.versionCode<=info.versionCode,'Only real public APKs can appear in update manifest');
          console.log('PASS: Android update syntax, version integrity and safe public release baseline');
          NODE
      - name: Test saved answers and separate account progress
        run: node test-memory.cjs
      - name: Verify offline quiz checkpoint and Continue / New flow
        run: node test-quiz-resume.cjs
      - name: Test game-style navigation and Google profile onboarding
        run: node test-game-ui.cjs
      - name: Verify iOS-inspired UI and account-aware progress
        run: node test-ios-polish.cjs
      - name: Verify premium iPhone-style Home, grammar card and mobile layout
        run: node test-premium-home.cjs
      - name: Verify Seen Words table and CEFR progress
        run: node test-seen-words.cjs
      - name: Verify all 370 Topics have word lists and functional quizzes
        run: |
          node test-topic-lessons.cjs
          node test-topic-reading.cjs
      - name: Verify per-word German tooltip, English Myanmar detail, grammar and word voice
        run: node test-reading-word-explorer.cjs
      - name: Verify trilingual long-form reading window and German narration seeking
        run: node test-reading-studio.cjs
      - name: Verify all topic titles have functioning MCQs and isolated practice
        run: node test-topic-quiz-ready.cjs
      - name: Verify compact Settings navigation and all existing controls
        run: node test-settings-navigation.cjs
      - name: Verify card-free UI and authentication entry
        run: node mobile/scripts/test-ui.mjs

