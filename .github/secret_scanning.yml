# GitHub reports the public Firebase Android client API key in google-services.json.
# Firebase client API keys are identifiers, not service-account secrets. This
# exception is limited to the precise Android client configuration file.
#
# SECURITY REVIEW REQUIRED BEFORE MERGING:
# - Verify this key is restricted to Firebase-related APIs in Google Cloud.
# - Verify Firestore Security Rules restrict users to their own data.
# - Never place service-account keys, private keys, or signing secrets here.
# - GitHub will not scan this one file for ANY future secrets, so review
#   all changes to it manually; other repository files remain scanned.
paths-ignore:
  - "mobile/android/app/google-services.json"
