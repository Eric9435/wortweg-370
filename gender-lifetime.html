ast (person)","der Gymnasiast","Usually","Grammar-school student"],["-at","der Kandidat","Caution","Candidate / ကိုယ်စားလှယ်လောင်း"]]],["DIE — Feminine (25)",["Ending","Example","Strength","Meaning"],[["-ung","die Wohnung","Strong","Apartment / တိုက်ခန်း"],["-heit","die Freiheit","Strong","Freedom / လွတ်လပ်မှု"],["-keit","die Möglichkeit","Strong","Possibility / ဖြစ်နိုင်ခြေ"],["-schaft","die Freundschaft","Strong","Friendship / မိတ်ဆွေဖြစ်မှု"],["-in (female suffix)","die Lehrerin","Strong","Female teacher / ဆရာမ"],["-ei","die Bäckerei","Strong","Bakery / မုန့်ဖုတ်ဆိုင်"],["-ion","die Information","Usually","Information / သတင်းအချက်အလက်"],["-tät","die Universität","Strong","University / တက္ကသိုလ်"],["-ität","die Elektrizität","Strong","Electricity / လျှပ်စစ်"],["-enz","die Kompetenz","Usually","Competence / ကျွမ်းကျင်မှု"],["-anz","die Toleranz","Usually","Tolerance / သည်းခံနိုင်မှု"],["-ie","die Energie","Usually","Energy / စွမ်းအင်"],["-ik","die Technik","Usually","Technology / နည်းပညာ"],["-ur","die Natur","Usually","Nature / သဘာဝ"],["-e","die Schule","Usually","School / ကျောင်း"],["-age","die Garage","Usually","Garage / ကားဂိုဒေါင်"],["-ette","die Zigarette","Usually","Cigarette / စီးကရက်"],["-üre","die Broschüre","Usually","Brochure / လက်ကမ်းစာစောင်"],["-ose","die Diagnose","Usually","Diagnosis / ရောဂါသတ်မှတ်ချက်"],["-sis","die Basis","Usually","Basis / အခြေခံ"],["-ade","die Limonade","Usually","Lemonade / အချိုရည်"],["-a","die Kamera","Caution","Camera / ကင်မရာ"],["-othek","die Bibliothek","Usually","Library / စာကြည့်တိုက်"],["-logie","die Biologie","Usually","Biology / ဇီဝဗေဒ"],["-grafie / -graphie","die Fotografie","Usually","Photography / ဓာတ်ပုံပညာ"]]],["DAS — Neuter (16)",["Ending","Example","Strength","Meaning"],[["-chen","das Mädchen","Strong","Girl / မိန်းကလေး"],["-lein","das Büchlein","Strong","Little book / စာအုပ်ငယ်"],["-ment","das Instrument","Usually","Instrument / တူရိယာ"],["-um","das Museum","Usually","Museum / ပြတိုက်"],["-ium","das Studium","Usually","Studies / ပညာသင်ခြင်း"],["-ma","das Thema","Usually","Topic / ခေါင်းစဉ်"],["-ett","das Ballett","Usually","Ballet / ဘဲလေး"],["-zeug (compound)","das Werkzeug","Compound","Tool / ကိရိယာ"],["-werk (compound)","das Kraftwerk","Compound","Power station / ဓာတ်အားပေးစက်ရုံ"],["-nis","das Ergebnis","Caution","Result / ရလဒ်"],["-tum","das Wachstum","Caution","Growth / ကြီးထွားမှု"],["-sel","das Rätsel","Caution","Riddle / ပဟေဠိ"],["-icht","das Dickicht","Usually","Thicket / ချုံနွယ်ထူထပ်ရာ"],["-tel (fraction)","das Viertel","Strong","Quarter / လေးပုံတစ်ပုံ"],["-ing (loanword)","das Training","Usually","Training / လေ့ကျင့်ရေး"],["-o","das Auto","Caution","Car / ကား"]]]],"notes":["Strong = suffix အစစ်နဲ့ ကိုက်ရင် confidence မြင့်တယ်။ Usually = အများစု; Caution = dictionary confirm လုပ်ရမယ်။","Additional feminine sub-patterns: -tion → die Funktion; -sion → die Diskussion; -itis → die Bronchitis။","-zeug/-werk က suffix ခန့်မှန်းချက်ထက် final component ပါတဲ့ compound rule ဖြစ်တယ်။"]},{"id":"strength","level":"A1–A2","title":"03 · Strong vs Weak Rules","subtitle":"Avoid false suffix matches","intro":"တကယ့် word-forming suffix နဲ့ စာလုံးအဆုံးတူတာကို မရောထွေးပါနှင့်။","tables":[["High-confidence suffixes",["Gender","Prefer first","Example"],[["DER","-ling, -ismus, -ist (person), -eur (person), -er/-ler (agent)","der Frühling, der Lehrer"],["DIE","-ung, -heit, -keit, -schaft, -in (female), -ei, -ität","die Rechnung, die Freiheit"],["DAS","-chen, -lein, nominalized infinitive","das Mädchen, das Lernen"]]],["Common traps",["Word","Correct","Reason"],[["der Lehrer","der","-er is an agent suffix"],["das Fenster","das","-er is only a letter ending"],["die Rechnung","die","-ung is a productive suffix"],["der Sprung","der","ends in ung, but not feminine -ung suffix"],["die Mutter","die","-er letter pattern is not reliable"]]]],"notes":["Rule အားနည်းရင် ခန့်မှန်းချက်ကို အဖြေအတည် မလုပ်ပါနှင့်။"]},{"id":"meaning","level":"A1–B2","title":"04 · Meaning-Based Rules","subtitle":"Days, months, nature, materials, people","intro":"အဓိပ္ပာယ်အုပ်စုအလိုက် Gender ခန့်မှန်းနိုင်တယ်။ အုပ်စုတိုင်းမှာ exceptions ရှိနိုင်တယ်။","tables":[["Masculine groups",["Category","Examples"],[["Male people","der Mann, der Vater, der Bruder"],["Weekdays","der Montag, der Freitag"],["Months","der Januar, der Oktober"],["Seasons","der Sommer, der Winter"],["Directions","der Norden, der Süden"],["Weather phenomena (many)","der Regen, der Wind, der Schnee"],["Car brand/model names (many)","der BMW, der Golf"]]],["Feminine groups",["Category","Examples"],[["Female people","die Mutter, die Schwester"],["Flowers (many)","die Rose, die Tulpe"],["Trees (many)","die Eiche, die Birke"],["Rivers (many in Germany)","die Elbe, die Donau"],["Number names as nouns","die Eins, die Zehn"],["Ship names","die Titanic"]]],["Neuter groups",["Category","Examples"],[["Children/young animals (many)","das Kind, das Baby, das Kalb"],["Metals (many)","das Gold, das Eisen"],["Nominalized infinitives","das Lesen, das Essen"],["Colors used as nouns","das Rot, das Blau"],["Letters as nouns","das A, das B"],["Ge- collective nouns (many)","das Gebirge, das Gestrüpp"]]]],"notes":["Exceptions: der Apfel, das Bier, das Mädchen, der Rhein, die Geschichte။ Meaning တစ်ခုတည်းနဲ့ မဆုံးဖြတ်ပါနှင့်။"]},{"id":"compounds","level":"A1–C2","title":"05 · Compound Nouns","subtitle":"Last noun (Grundwort) decides gender","intro":"Noun + Noun compound တွေမှာ အဆုံးက Grundwort က Gender သတ်မှတ်တယ်။","tables":[["Engineering examples",["Compound","Article","Final noun"],[["Stromnetz","das","das Netz"],["Stromversorgung","die","die Versorgung"],["Elektromotor","der","der Motor"],["Regelungstechnik","die","die Technik"],["Steuerungssystem","das","das System"],["Frequenzumrichter","der","der Umrichter"],["Datenübertragung","die","die Übertragung"],["Kraftwerk","das","das Werk"],["Messgerät","das","das Gerät"],["Mikrowellentechnik","die","die Technik"],["KI-Modell","das","das Modell"],["USB-Anschluss","der","der Anschluss"],["PDF-Da function renderQuiz(){
