<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>German Grammar 120 Tables | WortWeg</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#f7f9fc}
#view{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#master{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
#toolbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:5px;padding:5px;border:1px solid #cdd8e4;border-radius:13px;background:#ffffffea;box-shadow:0 2px 10px #12294e20;z-index:2}
#toolbar a,#toolbar button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#173b60;font:600 26px/1 Arial,sans-serif;text-decoration:none;cursor:pointer}
#toolbar a:hover,#toolbar button:hover{background:#eaf1f8}
#toolbar button:disabled{opacity:.35;cursor:default}
@media(max-width:480px){#toolbar a,#toolbar button{width:34px;height:34px;font-size:23px}}
@media print{#toolbar{display:none}#view{position:static;overflow:visible}#master{width:100% !important}}
</style>
<link rel="stylesheet" href="./quality-2026.css">
<script defer src="./quality-2026.js"></script>
</head>
<body>
<div id="view"><img id="master" src="./assets/german-grammar-a1-c1-120.svg" alt="German Grammar A1–C1, 120 complete reference tables" draggable="false"></div>
<nav id="toolbar" aria-label="Document navigation and zoom">
<a href="./lifetime-grammar.html" title="Back" aria-label="Back">‹</a>
<button id="out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
<button id="in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
<a href="./index.html" title="Close" aria-label="Close">×</a>
</nav>
<script>
(()=>{'use strict';
const view=document.getElementById('view'),poster=document.getElementById('master');
const steps=[1,1.5,2.25,3.4,5,7.5,11,16];let pos=0;
function setZoom(next){
 next=Math.max(0,Math.min(steps.length-1,next));if(next===pos)return;
 const x=(view.scrollLeft+view.clientWidth/2)/Math.max(1,view.scrollWidth);
 const y=(view.scrollTop+view.clientHeight/2)/Math.max(1,view.scrollHeight);
 pos=next;poster.style.width=(steps[pos]*100)+'%';
 requestAnimationFrame(()=>{view.scrollLeft=x*view.scrollWidth-view.clientWidth/2;view.scrollTop=y*view.scrollHeight-view.clientHeight/2});
 document.getElementById('out').disabled=pos===0;
 document.getElementById('in').disabled=pos===steps.length-1;
}
document.getElementById('out').addEventListener('click',()=>setZoom(pos-1));
document.getElementById('in').addEventListener('click',()=>setZoom(pos+1));
document.getElementById('out').disabled=true;
window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')setZoom(pos+1);if(e.key==='-')setZoom(pos-1)});
})();
</script>
</body>
</html>
